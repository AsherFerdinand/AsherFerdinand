<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Ferdinand Yurichson — Automotive Wireframe Console</title><desc id="desc">An original automotive engineering portfolio console. Decorative indicators do not report live system status.</desc><style>
.bg{fill:#FAFAF9}.panel{fill:none;stroke:#D6D3D1}.ink{fill:#18181B}.muted{fill:#64748B}.accent{fill:#C2410C}.wire{fill:none;stroke:#C2410C}.secondary{fill:none;stroke:#EA580C}.pill{fill:none;stroke:#D6D3D1}
@media(prefers-color-scheme:dark){.bg{fill:#090B0F}.panel,.pill{stroke:#30343B}.ink{fill:#F5F5F4}.muted{fill:#94A3B8}.accent{fill:#FF8A3D}.wire{stroke:#FF8A3D}.secondary{stroke:#FB923C}}
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Liberation Mono,monospace}.wire,.secondary,.panel,.pill{stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
.pulse{animation:status 4s ease-in-out infinite}@keyframes status{0%,100%{opacity:1}50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
