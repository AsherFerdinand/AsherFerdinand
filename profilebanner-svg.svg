<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#0A323A"/>
    </linearGradient>

    <!-- Professional Electric Cyan Signal Glow -->
    <linearGradient id="glow-cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Soft Blue Accent -->
    <linearGradient id="glow-blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4A90E2" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#4A90E2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- Left Side Background: Car Contour & Network Lines -->
  <g stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.35">
    <!-- Car Silhouette Line (Left) -->
    <path d="M 40 130 C 70 130 90 100 120 95 C 150 90 190 90 220 105 L 260 125 C 270 130 285 130 300 130" stroke-dasharray="4,2"/>
    <!-- Wheel Arch Motifs -->
    <path d="M 80 130 A 15 15 0 0 1 110 130"/>
    <path d="M 230 130 A 15 15 0 0 1 260 130"/>
    <!-- Connection Bus Line -->
    <path d="M 170 92 V 60 H 320 L 350 90 H 420"/>
    <circle cx="170" cy="60" r="3.5" fill="#00E5FF"/>
    <circle cx="350" cy="90" r="3.5" fill="#00E5FF"/>
  </g>

  <!-- Right Side Background: EV Battery Module & Cell Matrix -->
  <g stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.35">
    <!-- Main High-Voltage Battery Pack Enclosure -->
    <rect x="900" y="65" width="240" height="60" rx="6" stroke="#00E5FF" stroke-width="2"/>
    <!-- Battery Terminal Anode/Cathode Nubs -->
    <path d="M 894 85 V 105" stroke="#00E5FF" stroke-width="3"/>
    <path d="M 1146 88 V 102" stroke="#00E5FF" stroke-width="4"/>
    
    <!-- Individual Internal Battery Cell Slots -->
    <rect x="915" y="73" width="22" height="44" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <rect x="945" y="73" width="22" height="44" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <rect x="975" y="73" width="22" height="44" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <rect x="1005" y="73" width="22" height="44" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <rect x="1035" y="73" width="22" height="44" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <rect x="1065" y="73" width="22" height="44" rx="3" stroke-dasharray="2,2"/>
    <rect x="1095" y="73" width="22" height="44" rx="3" stroke-dasharray="2,2"/>

    <!-- BMS Data Routing Trace -->
    <path d="M 1020 125 V 145 H 850 L 820 125"/>
    <circle cx="1020" cy="125" r="3.5" fill="#00E5FF"/>
  </g>

  <!-- Bottom System Bus & CAN Signal Waveform Lines -->
  <g fill="none">
    <path d="M 50 260 H 350 L 390 220 H 810 L 850 260 H 1150" stroke="url(#glow-cyan)" stroke-width="1.5" opacity="0.35"/>
    <path d="M 0 210 h100 l15 -20 h30 l15 20 h120 l20 -30 h40 l20 30 h200 l15 -15 h30 l15 15 h200 l20 -30 h40 l20 30 h120 l15 -20 h30 l15 20 h100" stroke="url(#glow-blue)" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Main Name Heading -->
  <text x="600" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Ferdinand Yurichson</text>
  
  <!-- Subtitle -->
  <text x="600" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#8E9BAE">Automotive Engineer · M.Eng., TH Ingolstadt</text>
  
  <!-- Skills Line -->
  <text x="600" y="250" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" font-size="27" fill="#00E5FF">CAN · BMS · ADAS · Simulation · MATLAB/Simulink · AI/ML</text>
</svg>
