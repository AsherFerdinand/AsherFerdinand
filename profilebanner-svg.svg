<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ferdinand Yurichson — Automotive Engineering · Simulation · Intelligent Software</title>
  <desc id="desc">A connected automotive engineering ecosystem: a top-down autonomous vehicle with perception arcs and a planned path links battery, CAN, simulation, software and mechanical motifs around the central title.</desc>
  <style>
    .bg{fill:#FFFFFF}.name{fill:#111827}.sub{fill:#4B5563}.accent{stroke:#C2410C}.label{fill:#C2410C}
    .icon{stroke:#C2410C;opacity:.94}.vehicle{stroke:#C2410C;opacity:1;stroke-width:2.6}.detail{stroke:#EA580C}.trace{stroke:#9A3412;opacity:.62}.node{fill:#FFFFFF;stroke:#EA580C}.border{stroke:#E5E7EB}
    @media(prefers-color-scheme:dark){
      .bg{fill:#0B0D10}.name{fill:#F8FAFC}.sub{fill:#CBD5E1}.accent{stroke:#FB923C}.label{fill:#FB923C}
      .icon{stroke:#FB923C;opacity:.94}.vehicle{stroke:#FB923C;opacity:1}.detail{stroke:#FDBA74}.trace{stroke:#C2410C;opacity:.75}.node{fill:#0B0D10;stroke:#FDBA74}.border{stroke:#27272A}
    }
    text{font-family:Segoe UI,Arial,sans-serif}
    .icon,.vehicle,.trace,.accent,.border{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .icon,.trace,.node{stroke-width:2}
  </style>
  <rect class="bg" width="1200" height="320" rx="16"/>
  <rect class="border" x="1" y="1" width="1198" height="318" rx="16"/>
  <!-- A shared top/bottom signal bus connects every domain; the text area stays clear. -->
  <g class="trace">
    <path d="M156 58h40l27-28h287M610 30h355l31 28h44"/>
    <path d="M196 58v96h-24m24 0v102h-18l-17-15M196 256l27 30h756l25-30h46"/>
    <path d="M1136 58h26v99h-55m55 0v98h-58"/>
    <path d="M55 58H30v183h25M30 154h28"/>
    <path d="M510 47H350l-16-17M610 47h167l17-17M450 286l18-18h274l18 18"/>
  </g>
  <!-- Battery module -->
  <g class="icon">
    <rect x="55" y="37" width="94" height="42" rx="5"/>
    <path d="M149 49h7v18h-7M73 47v22m19-22v22m19-22v22m19-22v22"/>
    <!-- Vehicle and its telemetry port -->
    <path d="M58 154h12l15-20h49l22 20h16v19h-12m-79 0H58v-19m40 19h44M85 134l6-10h32l11 10"/>
    <circle cx="89" cy="173" r="9"/><circle cx="151" cy="173" r="9"/>
    <!-- CAN nodes, with a shared bus and signal trace -->
    <rect x="55" y="230" width="33" height="22" rx="3"/><rect x="128" y="230" width="33" height="22" rx="3"/>
    <path d="M71 252v16h73v-16M88 241h40M94 241l5-7 8 14 7-7"/>
    <!-- Coupled simulation blocks share input/output ports on the upper bus. -->
    <rect x="510" y="14" width="100" height="44" rx="5"/>
    <rect x="522" y="25" width="24" height="22" rx="2"/><rect x="575" y="25" width="23" height="22" rx="2"/>
    <path d="M546 36h29m-6-5 6 5-6 5M510 30h12m76 0h12"/>
    <!-- Software interface -->
    <rect x="1040" y="31" width="96" height="54" rx="5"/><path d="M1040 46h96M1053 39h2m7 0h2m-11 19h22v15h-22m32-15h36m-36 8h28m-28 7h18"/>
    <!-- Autonomous vehicle: schematic top view, front perception and planned path. -->
    <!-- Mechanical assembly: a dimensioned CAD component -->
    <path d="M1050 240l27-15 27 15v30l-27 15-27-15zM1050 240l27 15 27-15m-27 15v30M1050 219v-8h54v8m-54-12v8m54-8v8"/>
  </g>
  <g class="vehicle">
    <rect x="1045" y="128" width="39" height="64" rx="11"/>
    <path d="M1052 143h25l-3 12h-19zM1053 178h23M1041 141v13m47-13v13m-47 16v12m47-12v12"/>
    <path class="detail" d="M1045 117q19-16 39 0M1033 107q31-27 63 0M1064 128v-18m-5 5 5-5 5 5"/>
    <path d="M1084 174h17q22 0 22-22v-34"/>
    <rect x="1118" y="111" width="10" height="10" rx="2"/>
    <path d="M1084 157h23"/>
  </g>
  <g class="node">
    <circle cx="196" cy="154" r="3"/><circle cx="196" cy="256" r="3"/>
    <circle cx="334" cy="30" r="3"/><circle cx="794" cy="30" r="3"/>
    <circle cx="450" cy="286" r="3"/><circle cx="760" cy="286" r="3"/>
    <circle cx="1162" cy="157" r="3"/><circle cx="30" cy="154" r="3"/>
  </g>
  <path class="accent" d="M250 88h42" stroke-width="4"/>
  <text class="name" x="250" y="147" font-size="54" font-weight="700">Ferdinand Yurichson</text>
  <text class="sub" x="250" y="190" font-size="23">Automotive Engineering · Simulation · Intelligent Software</text>
  <text class="label" x="250" y="237" font-size="15" letter-spacing="2">VEHICLE SYSTEMS / ENGINEERING DATA / SOFTWARE TOOLS</text>
</svg>
