<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-labelledby="title">
  <title id="title">Home heating</title>
  <style>
    .heating-path {
      fill: none;
      stroke: #1E293B;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-color-scheme: dark) {
      .heating-path {
        stroke: #FFFFFF;
      }
    }
  </style>

  <!-- House outline and chimney -->
  <path class="heating-path"
        d="M 18 46 L 50 20 L 69 35 L 69 27 L 79 27 L 79 43 L 86 49
           M 18 46 L 18 79 Q 18 83 22 83 L 78 83 Q 82 83 82 79 L 82 51"/>

  <!-- Rising heat -->
  <path class="heating-path" d="M 37 54 C 32 49 40 45 36 39"/>
  <path class="heating-path" d="M 50 54 C 45 49 53 45 49 39"/>
  <path class="heating-path" d="M 63 54 C 58 49 66 45 62 39"/>

  <!-- Simple thermostat -->
  <path class="heating-path" d="M 46 64 L 46 73 A 5 5 0 1 0 54 73 L 54 64 A 4 4 0 0 0 46 64 Z"/>
</svg>
